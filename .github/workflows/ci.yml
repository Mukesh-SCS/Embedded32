name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Configure npm network resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies (retry)
        run: |
          npm ci || npm ci || npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package audit
        run: npm run audit:packages

      - name: Package install smoke tests
        run: npm run test:package-install

      - name: Lab verification
        run: npm run test:labs

      - name: Example verification
        run: npm run test:examples

      - name: Documentation verification
        run: npm run test:docs

      - name: Documentation consistency
        run: npm run test:docs-status

      - name: Coverage report
        if: matrix.node-version == 20
        run: npm run test:coverage

  verify-windows:
    name: Verify (Windows, Node 20)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Configure npm network resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies (retry)
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { npm ci }
          if ($LASTEXITCODE -ne 0) { npm ci }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and core verification
        run: |
          npm run build
          npm run test:labs
          npm run test:examples
