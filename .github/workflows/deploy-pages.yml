name: Deploy Embedded32 Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "apps/demo/**"
      - "docs/**"
      - "labs/**"
      - "embedded32-*/README.md"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "package-lock.json"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate API reference
        run: npm run docs:api

      - name: Build documentation site (static export)
        run: npm run build --workspace apps/site

      - name: Validate GitHub Pages build
        run: node scripts/verify-pages-build.mjs

      - name: Add SPA fallback (safety net)
        run: |
          if [ -f apps/site/out/index.html ] && [ ! -f apps/site/out/404.html ]; then
            cp apps/site/out/index.html apps/site/out/404.html
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
