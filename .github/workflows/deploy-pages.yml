name: Deploy Embedded32 Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/site/**'
      - 'apps/demo/**'
      - 'docs/**'
      - 'labs/**'
      - 'embedded32-*/README.md'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
      - 'package-lock.json'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Configure npm network resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies (retry)
        run: |
          npm ci || npm ci || npm ci

      - name: Generate API reference
        run: npm run docs:api

      - name: Build documentation site (static export)
        run: npm run build --workspace apps/site

      - name: Validate GitHub Pages build
        run: node scripts/verify-pages-build.mjs

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests (production export)
        run: |
          E2E_STAGE_ONLY=1 node scripts/prepare-e2e-pages.mjs
          npx playwright test

      - name: Add SPA fallback (safety net)
        run: |
          if [ -f apps/site/out/index.html ] && [ ! -f apps/site/out/404.html ]; then
            cp apps/site/out/index.html apps/site/out/404.html
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Backoff before deploy retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Backoff before final deploy retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
