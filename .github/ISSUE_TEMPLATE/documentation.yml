name: Documentation
description: Report missing, unclear, or incorrect documentation
title: '[Docs]: '
labels: ['documentation']
body:
  - type: input
    id: location
    attributes:
      label: Document path or URL
      placeholder: 'docs/getting-started.md or package README'
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Student
        - Instructor
        - Contributor
        - npm package user
        - Other
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional draft text or outline
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Willing to submit a documentation PR?
      options:
        - 'Yes'
        - 'No'
        - 'Maybe'
    validations:
      required: true
