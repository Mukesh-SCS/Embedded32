name: Feature request
description: Propose a new capability or improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. Embedded32 prioritizes **education**, **reliability**, and **honest documentation**.

  - type: input
    id: package
    attributes:
      label: Primary package or area
      placeholder: '@embedded32/sim or apps/demo'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who benefits (students, instructors, integrators) and why?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Would this require a breaking API change?
      options:
        - 'No'
        - 'Yes'
        - 'Unsure'
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Willing to contribute an implementation?
      options:
        - 'Yes'
        - 'No'
        - 'Maybe'
    validations:
      required: true
